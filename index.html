<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de IMC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f4f6;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: min(380px, 92vw);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.4rem;
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #d1d5db;
      margin-bottom: 14px;
      box-sizing: border-box;
      font-size: 1rem;
    }

    .acoes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px;
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    #calcular {
      background: #2563eb;
    }

    #calcular:hover {
      background: #1e40af;
    }

    #limpar {
      background: #6b7280;
    }

    #limpar:hover {
      background: #4b5563;
    }

    .resultado {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1e3a8a;
      min-height: 24px;
      text-align: center;
      font-weight: 600;
    }

    .hint {
      margin-top: 10px;
      text-align: center;
      color: #6b7280;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Calculadora de IMC</h1>

    <form id="imcForm">
      <label for="peso">Peso (kg)</label>
      <input id="peso" type="number" min="1" step="0.1" placeholder="Ex: 70" required>

      <label for="altura">Altura (m)</label>
      <input id="altura" type="number" min="0.5" step="0.01" placeholder="Ex: 1.75" required>

      <div class="acoes">
        <button id="calcular" type="submit">Calcular</button>
        <button id="limpar" type="button">Limpar</button>
      </div>
    </form>

    <div id="resultado" class="resultado">Preencha os campos para calcular.</div>
    <p class="hint">Dica: você também pode pressionar Enter para calcular.</p>
  </main>

  <script>
    const form = document.getElementById('imcForm');
    const pesoInput = document.getElementById('peso');
    const alturaInput = document.getElementById('altura');
    const resultado = document.getElementById('resultado');
    const limpar = document.getElementById('limpar');

    function classificarImc(imc) {
      if (imc < 18.5) return 'Abaixo do peso';
      if (imc < 25) return 'Peso normal';
      if (imc < 30) return 'Sobrepeso';
      if (imc < 35) return 'Obesidade grau I';
      if (imc < 40) return 'Obesidade grau II';
      return 'Obesidade grau III';
    }

    function calcularImc() {
      const peso = parseFloat(pesoInput.value);
      const altura = parseFloat(alturaInput.value);

      if (!Number.isFinite(peso) || !Number.isFinite(altura) || peso <= 0 || altura <= 0) {
        resultado.textContent = 'Informe peso e altura válidos.';
        return;
      }

      const imc = peso / (altura * altura);
      const classificacao = classificarImc(imc);
      resultado.textContent = `Seu IMC é ${imc.toFixed(1)} (${classificacao}).`;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      calcularImc();
    });

    [pesoInput, alturaInput].forEach((campo) => {
      campo.addEventListener('input', () => {
        if (pesoInput.value && alturaInput.value) {
          calcularImc();
        }
      });
    });

    limpar.addEventListener('click', () => {
      form.reset();
      resultado.textContent = 'Preencha os campos para calcular.';
      pesoInput.focus();
    });
  </script>
</body>
</html>
